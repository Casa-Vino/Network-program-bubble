name: device_scanner
description: Bubble nearby wireless discovery and local network assessment.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  network_info_plus: ^5.0.3
  multicast_dns: ^0.3.2+6
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5
  smb_connect: ^0.0.9
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  package_info_plus: ^8.0.0
  open_filex: ^4.4.0
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
